name: CI/CD Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: lint + basic import check ──────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/

      - name: Check imports (syntax)
        run: python -c "import app.main"
        env:
          # Minimal env so pydantic-settings doesn't error on import
          POSTGRES_URL: postgresql+asyncpg://user:pass@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0

  # ── CD: deploy on push to main ─────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_ENV
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pull latest code"
            git pull origin main

            echo "==> Write .env from secret"
            printf '%s' "$BACKEND_ENV" > backend/.env

            echo "==> Rebuild & restart containers"
            docker compose up --build -d

            echo "==> Remove dangling images"
            docker image prune -f

            echo "==> Health check"
            sleep 5
            curl -fsS http://localhost:8001/api/v1/health || (docker compose logs api && exit 1)
